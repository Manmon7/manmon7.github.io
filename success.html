<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 완료 - Premium 활성화</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 40px; border-radius: 14px; border: 1px solid #333; }
        h1 { color: #f5c518; }
        p { color: #aaa; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 결제 완료!</h1>
        <p>프리미엄(광고 제거) 모드가 성공적으로 활성화되었습니다.<br>이제 광고 없이 쾌적하게 이용하실 수 있습니다.</p>
        <p>잠시 후 메인 화면으로 이동합니다...</p>
    </div>

    <script>
        // 핵심: 브라우저에 프리미엄 유저 증표 저장
        localStorage.setItem("ad_free_user", "true");

        // 3초 후 메인 페이지로 자동 이동
        setTimeout(function() {
            window.location.href = "index.html";
        }, 3000);
    </script>
</body>
</html>
